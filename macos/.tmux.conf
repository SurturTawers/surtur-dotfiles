# ── Terminal ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# truecolor passthrough for Ghostty / WezTerm
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'
set -g mouse on
# tell programs when their pane gains/loses focus: nvim re-reads files Claude changed
# (autoread/checktime on FocusGained) and gitsigns refreshes
set -g focus-events on
# copy to the macOS clipboard from nvim/Claude over OSC 52, also inside tmux
set -g set-clipboard on

# ── Behaviour ─────────────────────────────────────────────────────────────────
set -g history-limit 50000        # long Claude sessions scroll back far
set -g base-index 1               # windows start at 1 (matches the keyboard)
setw -g pane-base-index 1
set -g renumber-windows on        # no gaps after closing a window
set -g display-time 2000
setw -g mode-keys vi              # vim keys in copy mode (prefix [)
# name windows after their folder (manual renames with prefix , are kept)
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
# bells (Claude agents waiting for you) mark the window; Ghostty gets the bell too
set -g bell-action any
set -g visual-bell off

source-file ~/.config/.tmux/.tmux.keybinds.conf

set-option -g status-position top

# ── Plugins (tpm: prefix I install, prefix U update, prefix alt-u clean) ──────
set -g @plugin 'tmux-plugins/tpm'
# Ctrl-h/j/k/l move between nvim splits and tmux panes
set -g @plugin 'christoomey/vim-tmux-navigator'
# y in copy mode copies to the system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

#source-file ~/.config/.tmux/.tmux.kanagawa.conf
source-file ~/.config/.tmux/.tmux.catppuccin.conf
#source-file ~/.config/.tmux/.tmux.rosepine.conf
#source-file ~/.config/.tmux/.tmux.nightfox.conf

# tmux-resurrect: save/restore sessions across reboots (prefix C-s / prefix C-r)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum: saves automatically every 10 minutes and restores on tmux start
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval 10

# init tmux plugin manager (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# Transparency/translucency overrides (Uncomment to enable)
#set -g status-style bg=default
#set -g window-style 'bg=default'
#set -g window-active-style 'bg=default'
