# Catppuccin Mocha for tmux (static styles, no plugin; palette: github.com/catppuccin/palette)
# base #1e1e2e  mantle #181825  crust #11111b  surface0 #313244  surface1 #45475a
# overlay1 #7f849c  text #cdd6f4  blue #89b4fa  mauve #cba6f7  peach #fab387  red #f38ba8

set -g mode-style "fg=#1e1e2e,bg=#cba6f7"
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#cdd6f4,bg=#181825"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

# [ session ]  (turns red while prefix is pressed)
set -g status-left "#[fg=#11111b,bold]#{?client_prefix,#[bg=#f38ba8],#[bg=#cba6f7]} #S #[default]  "
# [ ● N agents waiting ]  [ date time ]
set -g status-right "#{?#{W:#{?#{==:#{@claude_state},waiting},x,}},#[fg=#11111b#,bg=#fab387#,bold] ● #{n:#{W:#{?#{==:#{@claude_state},waiting},x,}}} waiting #[default] ,}#[fg=#cdd6f4,bg=#313244] %d-%m %H:%M "

# windows: "1 k2"; current one is a solid blue block; Z = zoomed pane
# Claude agent state before the name: ⚙ working, ● waiting for you (peach), ✓ done (green)
setw -g window-status-separator ""
setw -g window-status-style "fg=#7f849c,bg=#181825"
setw -g window-status-activity-style "fg=#fab387,bg=#181825"
setw -g window-status-bell-style "fg=#11111b,bg=#fab387,bold"
setw -g window-status-format " #I #{?#{==:#{@claude_state},waiting},#[fg=#fab387#,bold]● ,#{?#{==:#{@claude_state},working},⚙ ,#{?#{==:#{@claude_state},done},#[fg=#a6e3a1]✓ ,}}}#W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I #{?#{==:#{@claude_state},waiting},● ,#{?#{==:#{@claude_state},working},⚙ ,#{?#{==:#{@claude_state},done},✓ ,}}}#W#{?window_zoomed_flag, Z,} "
