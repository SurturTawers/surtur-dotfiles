# Prefix: <ctrl + x>
set -g prefix C-x
unbind C-b
bind-key C-x send-prefix

# Splits and new windows open in the current pane's folder
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# <prefix + r> reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Resize with <prefix + H/J/K/L> (repeatable: prefix once, then tap); <prefix + m> zoom.
# Not alt + arrows: Claude Code uses alt-up/down (changed-files list) and alt-left/right
# (word jumps), as do zsh and nvim.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

# Windows: <prefix + 1..9> (built-in; windows start at 1). Not alt + 1..9: AeroSpace uses
# those for workspaces. <prefix + tab> previous window
bind Tab last-window

# Copy mode (vi): v select, C-v rectangle, y copy (tmux-yank), <prefix + [> enter
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Popups (close with q / esc / exit)
# <prefix + g> lazygit in the current folder
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
# <prefix + s> sessions and windows picker (built-in tree, zoomed)
bind s choose-tree -Zs

# Claude agents (state comes from Claude Code hooks, see claude-status.sh)
# <prefix + a> jump to the next agent waiting for you
bind a run-shell 'w=$(tmux list-windows -a -F "#{@claude_state} #{session_name}:#{window_index}" | awk "\$1==\"waiting\"{print \$2; exit}"); [ -n "$w" ] && tmux switch-client -t "$w" || tmux display-message "No Claude agent is waiting"'
# <prefix + A> pick any agent window (all sessions), showing its state
bind A choose-tree -Zw -f '#{!=:#{@claude_state},}' -F '#{?#{==:#{@claude_state},waiting},● waiting,#{?#{==:#{@claude_state},working},⚙ working,✓ done}}  #{pane_current_path}'
