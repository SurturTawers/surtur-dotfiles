# Loaded via LG_CONFIG_FILE (see .zshrc); runtime state stays in ~/Library/Application Support/lazygit
gui:
  nerdFontsVersion: "3"
  sidePanelWidth: 0.25
  showDivergenceFromBaseBranch: arrowAndNumber
git:
  # cycle with | (reverse with \)
  diffRenderers:
    - name: delta
      command: delta --dark --paging=never --line-numbers
    - name: delta side-by-side
      command: delta --dark --paging=never --side-by-side --line-numbers
    - name: difftastic
      type: extDiff
      command: difft --color=always --context={{diffContext}}
os:
  # From nvim's lazygit (<leader>lg), `e` opens the file in that same nvim instead of
  # nesting a second one; from a plain shell it just starts nvim.
  editPreset: "nvim-remote"
